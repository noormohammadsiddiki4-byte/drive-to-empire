 if(dest){const q=at(dest.s,RW+2.5);destM.position.set(q.x,8,q.z);if(dest.s<car.s-20){dest=null;car.pax=0;destM.visible=false;msg('Missed destination')}}
 if(STA.s<car.s-30)STA.s=car.s+900+Math.random()*800;{const q=at(STA.s,RW+4);STA.m.position.set(q.x,0,q.z);STA.m.rotation.y=-q.t;STA.m.visible=L>=4}
 if(L>=4){car.fuel=Math.max(0,car.fuel-dt*(.08+Math.abs(car.v)/(CARS[S.cur].v/3.6)*.35+(KY.g?.08:0)));if(car.fuel<=0&&car.v>0){car.v=Math.max(0,car.v-6*dt);msg('Out of fuel - find a station')}}
 if(L>=5){const kmh=car.v*3.6,LM=AR[AI].lim+5;if(kmh>LM)ot+=dt;else ot=Math.max(0,ot-dt);if(ot>3&&!pol){pol={s:car.s-60};polM.visible=true;msg('POLICE! Slow down!')}
  if(pol){pol.s+=((kmh>LM?car.v*1.12+6:car.v*.75)*dt);sir+=dt;if(sir>.5){sir=0;tone(Math.random()<.5?700:900,.4,'square',.04)}const q=at(pol.s,car.lat);polM.position.set(q.x,0,q.z);polM.rotation.y=-q.t;const fl=Math.sin(clk*14)>0;pr.emissiveIntensity=fl?3:.2;pb.emissiveIntensity=fl?.2:3;
   if(pol.s>=car.s-4){const f=Math.min(S.money,600);S.money-=f;pol=null;polM.visible=false;ot=0;msg('Caught! Fine -$'+f)}else if(pol.s<car.s-300){pol=null;polM.visible=false;ot=0;pay(100);msg('Escaped! +$100')}}}}
const PR=[8000,15000,22000,30000,45000],AR=[{n:'City',lim:60,amp:1,min:1},{n:'Highway',lim:100,amp:.4,min:3},{n:'Mountain',lim:70,amp:1.6,min:5}];let gi=S.cur,AI=0;
function gref(){const o=S.own.includes(gi),lk=lvl()<gi+1,c=CARS[gi],b=$('bb');$('cn').textContent=c.n+' - '+c.v+' km/h';b.textContent=o?(S.cur==gi?'SELECTED':'SELECT'):lk?'LOCKED Lv '+(gi+1):'BUY $'+PR[gi];b.style.opacity=!o&&lk?.5:1;$('ab').textContent='AREA: '+AR[AI].n+(lvl()<AR[AI].min?' (Lv '+AR[AI].min+')':'')}
function bsel(){if(!S.own.includes(gi)){if(lvl()<gi+1||S.money<PR[gi])return;S.money-=PR[gi];S.own.push(gi)}S.cur=gi;save();gref()}
function parea(){AI=(AI+1)%3;gref()}
const HLN=24,HL=[],hlm=new THREE.MeshStandardMaterial({color:0x6b7a6a,roughness:1,flatShading:true});for(let k=0;k<HLN;k++){const m=new THREE.Mesh(new THREE.ConeGeometry(1,1,7),hlm);sc.add(m);HL.push(m)}
function placeH(base){for(let k=0;k<HLN;k++){const m=HL[k];m.visible=AI==2;if(AI!=2)continue;let n=Math.floor(base/HLN)*HLN+k;if(n<base)n+=HLN;const h=Math.abs(Math.sin(n*7.31)*9871.3)%1,p=at(n*80,((n&1)?1:-1)*(70+h*120));m.scale.set(40+h*50,50+h*80,40+h*50);m.position.set(p.x,m.scale.y/2-2,p.z)}}
let eo,eg,ef;function engStart(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();if(eo)return;eo=ac.createOscillator();eg=ac.createGain();ef=ac.createBiquadFilter();eo.type='sawtooth';ef.type='lowpass';ef.frequency.value=500;eg.gain.value=0;eo.connect(ef);ef.connect(eg);eg.connect(ac.destination);eo.start()}catch(e){}}
function engUpd(){if(!eo)return;const s=Math.abs(car.v)/(CARS[S.cur].v/3.6);eo.frequency.value=45+s*150+(KY.g?15:0);ef.frequency.value=300+s*900;eg.gain.value=.035+(KY.g?.03:0)}
const mc=$('mm'),mg=mc.getContext('2d');
function mm(){const w=90,h=120,cp=car.m.position,t=at(car.s,car.lat).t,sn=Math.sin(t),cs=Math.cos(t),K=(h-14)/420,P2=(x,z)=>{const dx=x-cp.x,dz=z-cp.z;return[w/2+(dx*cs+dz*sn)*K*1.2,h-12-(dx*sn-dz*cs)*K]};
 mg.clearRect(0,0,w,h);mg.strokeStyle='#777';mg.lineWidth=5;mg.beginPath();const s0=Math.max(0,car.s-40);for(let s=s0;s<car.s+380;s+=20){const q=at(s,0),[x,y]=P2(q.x,q.z);s==s0?mg.moveTo(x,y):mg.lineTo(x,y)}mg.stroke();
 const dot=(s,lat,c,r)=>{if(s<car.s-40||s>car.s+380)return;const q=at(s,lat),[x,y]=P2(q.x,q.z);mg.fillStyle=c;mg.fillRect(x-r,y-r,r*2,r*2)};
 TRF.forEach(t=>dot(t.s,t.lat,'#aaa',1.5));COIN.forEach(k=>dot(k.s,k.lat,'#f3d27a',1.5));PAS.forEach(p=>p.s>0&&dot(p.s,p.lat,'#fff',2));if(dest)dot(dest.s,RW+2.5,'#ff0',3);if(lvl()>=4)dot(STA.s,RW+4,'#4caf50',3);if(pol)dot(pol.s,car.lat,'#f33',3);
 mg.fillStyle='#d9a520';mg.beginPath();mg.arc(w/2,h-12,3.5,0,7);mg.fill()}
// loop
function frame(t){if(!run)return;requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1e3);last=t;clk+=dt;const c=CARS[S.cur],vm=c.v/3.6;
 car.st+=(((KY.r?1:0)-(KY.l?1:0))-car.st)*Math.min(1,dt*7);
 if(KY.g&&!(lvl()>=4&&car.fuel<=0))car.v+=14*dt*(1-Math.max(0,car.v)/vm*.8);if(KY.b){if(car.v>0)car.v=Math.max(0,car.v-30*dt);else car.v-=4*dt}
 car.v-=Math.sign(car.v)*(.5+Math.abs(car.v)*.02)*dt;car.v=Math.max(-8,Math.min(vm,car.v));if(Math.abs(car.v)<.15&&!KY.g&&!KY.b)car.v=0;
 car.lat+=car.st*dt*(2.4*(.5+.5*Math.min(1,Math.abs(car.v)/12)))-curv(car.s+10)*car.v*car.v*dt*.35;
 if(Math.abs(car.lat)>RW+.3)car.v*=1-1.5*dt;car.lat=Math.max(-RW-3,Math.min(RW+3,car.lat));
 const ps=car.s;car.s=Math.max(0,car.s+car.v*dt);acc+=Math.abs(car.v)*dt;if(acc>50){acc-=50;pay(5)}
 const p=at(car.s,car.lat),yaw=car.st*.1;car.m.position.set(p.x,0,p.z);car.m.rotation.set(-car.st*car.v*.0015,-(p.t+yaw),0,'YXZ');car.m.userData.tl.emissiveIntensity=KY.b&&car.v>1?3.5:1.2;
 for(const t of TRF){if(t.s<car.s-30||t.s>car.s+500){t.s=car.s+90+Math.random()*300;t.lat=LANES[Math.random()<.5?0:2];t.v=(7+Math.random()*8)*(AI==1?1.8:1)}t.s+=t.v*dt;const q=at(t.s,t.lat);t.m.position.set(q.x,0,q.z);t.m.rotation.y=-q.t;const ds=t.s-car.s;if(ds>-4.5&&ds<4.8&&Math.abs(t.lat-car.lat)<2.1){car.v*=.35;t.s=car.s+400;msg('Crash!')}}
 for(const k of COIN){if(k.s<car.s-10){k.s=car.s+40+Math.random()*250;k.lat=LANES[Math.random()*3|0]}const q=at(k.s,k.lat);k.m.position.set(q.x,1,q.z);k.m.rotation.y+=dt*3;if(Math.abs(k.s-car.s)<2.5&&Math.abs(k.lat-car.lat)<2){pay(25);k.s=-99}}
 const[i,se]=env();updRoad();upTL(ps);game(dt);place(Math.max(0,Math.floor(car.s/8)-4));placeH(Math.max(0,Math.floor(car.s/80)-3));placeL(Math.max(0,Math.floor(car.s/24)-2));ground.position.set(p.x,0,p.z);gt.offset.set(p.x/5,-p.z/5);
 const cp=at(car.s-8.5,car.lat*.7),lk=at(car.s+14,car.lat*.5),sk=Math.abs(car.lat)>RW?Math.random()*.08:0;cam.position.lerp(new THREE.Vector3(cp.x,3.4+sk,cp.z),Math.min(1,dt*6));cam.lookAt(lk.x,1.2,lk.z);cam.fov=60+Math.abs(car.v)*.6;cam.updateProjectionMatrix();
 sv+=dt;if(sv>5){sv=0;save()}if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
 $('h1').textContent=`${Math.abs(car.v*3.6|0)} km/h  $${S.money|0}`;$('h2').textContent=`${AR[AI].n} | Lv${lvl()} ${LN[lvl()-1]} | ${PH[i]}${lvl()>=3?' | '+SE[se]:''}${lvl()>=4?' | Fuel '+(car.fuel|0)+'%':''}${car.pax?' | Pax '+car.pax+' T '+Math.max(0,tlim-el|0)+'s':''}`;
 engUpd();mm();R.render(sc,cam)}
gref();
</script></body></html>
