 if(L>=4){car.fuel=Math.max(0,car.fuel-dt*(.08+Math.abs(car.v)/(CARS[S.cur].v/3.6)*.35+(KY.g?.08:0)));if(car.fuel<=0&&car.v>0){car.v=Math.max(0,car.v-6*dt);msg('Out of fuel - find a station')}}

/* ===== CHECKPOINT LOGIC (replaces old always-on police) ===== */
function updCheckpoints(dt){
  for(let k=0;k<CPN;k++){
    const c=CPS[k];
    // recycle checkpoint ahead of car
    if(c.s<car.s-60){c.s=car.s+CPSSPACING*(1+Math.floor(Math.random()*2))+120;c.state=0;c.wait=0;c.passed=0}
    const q=at(c.s,0);
    c.g.position.set(q.x,0,q.z);
    c.g.rotation.y=-q.t;
    c.line.position.set(0,.05,0);c.line.rotation.set(-Math.PI/2,0,0);
    c.g.visible=(AI==0)||(AI==5&&loopZone(car.s)==0);   // checkpoints only in City area / City zone
    if(!c.g.visible)continue;
    const dist=c.s-car.s;
    // flashing lights
    const fl=Math.sin(clk*10)>0;
    c.bl.material.emissiveIntensity=fl?2.5:.3;
    c.pl1.material.emissiveIntensity=fl?2.5:.3;
    c.pl2.material.emissiveIntensity=fl?.3:2.5;
    // state machine
    if(c.state==0){
      // approaching
      c.bar.material.emissiveIntensity=.6;
      if(dist<28&&dist>0){c.state=1;c.wait=0;if(msg('CHECKPOINT - STOP!',4))tone(500,.3,'square',.05)}
    }else if(c.state==1){
      // must stop briefly at the checkpoint (tolerant)
      const kmh=Math.abs(car.v)*3.6;
      if(dist<14&&dist>-6){
        if(kmh<20){c.wait+=dt;c.bar.material.emissiveIntensity=1.5;
          if(c.wait>=0.7){c.state=2;c.passed=1;pay(100);msg('Checkpoint cleared +$100');tone(900,.2)}
        }else{c.wait=Math.max(0,c.wait-dt*.5)}
      }else if(dist<=-6){
        // sped through / messed around → police chase from behind
        c.state=3;c.wait=0;pol={s:car.s-55};polM.visible=true;msg('CHECKPOINT RUN! POLICE CHASING!');tone(300,.6,'square',.06)
      }
    }else if(c.state==3){
      // being chased — police closes in from behind
      pol.s+=(car.v*1.15+7)*dt;
      sir+=dt;if(sir>.5){sir=0;tone(Math.random()<.5?700:900,.4,'square',.04)}
      const pq=at(pol.s,car.lat);polM.position.set(pq.x,0,pq.z);polM.rotation.y=-pq.t;
      const fl2=Math.sin(clk*14)>0;pr.emissiveIntensity=fl2?3:.2;pb.emissiveIntensity=fl2?.2:3;
      if(pol.s>=car.s-4){const f=Math.min(S.money,600);S.money-=f;pol=null;polM.visible=false;c.state=4;msg('Caught! Fine -$'+f)}
      else if(pol.s<car.s-300){pol=null;polM.visible=false;c.state=4;pay(100);msg('Escaped! +$100')}
    }
  }
}

const HLN=24,HL=[],hlm=new THREE.MeshStandardMaterial({color:0x6b7a6a,roughness:1,flatShading:true});for(let k=0;k<HLN;k++){const m=new THREE.Mesh(new THREE.ConeGeometry(1,1,7),hlm);sc.add(m);HL.push(m)}

 mg.clearRect(0,0,w,h);mg.strokeStyle='#777';mg.lineWidth=5;mg.beginPath();const s0=Math.max(0,car.s-40);for(let s=s0;s<car.s+380;s+=20){const q=at(s,0),[x,y]=P2(q.x,q.z);s==s0?mg.moveTo(x,y):mg.lineTo(x,y)}mg.stroke();
 const dot=(s,lat,c,r)=>{if(s<car.s-40||s>car.s+380)return;const q=at(s,lat),[x,y]=P2(q.x,q.z);mg.fillStyle=c;mg.fillRect(x-r,y-r,r*2,r*2)};
 TRF.forEach(t=>dot(t.s,t.lat,'#aaa',1.5));COIN.forEach(k=>dot(k.s,k.lat,'#f3d27a',1.5));PAS.forEach(p=>p.s>0&&dot(p.s,p.lat,'#fff',2));if(dest)dot(dest.s,RW+2.5,'#ff0',3);if(lvl()>=4)dot(STA.s,RW+4,'#4caf50',3);if(pol)dot(pol.s,car.lat,'#f33',3);
 CPS.forEach(c=>{if(c.s>0&&c.state<4)dot(c.s,0,c.state==1?'#ff0':'#0af',3)});
 mg.fillStyle='#d9a520';mg.beginPath();mg.arc(w/2,h-12,3.5,0,7);mg.fill()}
// loop
function frame(t){if(!run)return;requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1e3);last=t;clk+=dt;const c=CARS[S.cur],vm=c.v/3.6;
 car.st+=(((KY.r?1:0)-(KY.l?1:0))-car.st)*Math.min(1,dt*7);
 const _cv=Math.abs(curv(car.s+10));if(_cv>0.02)car.v*=1-Math.min(.18,_cv*5)*dt;   // gentle slow in turns (never stops)
 if(KY.g&&!(lvl()>=4&&car.fuel<=0))car.v+=14*dt*(1-Math.max(0,car.v)/vm*.8);if(KY.b){if(car.v>0)car.v=Math.max(0,car.v-30*dt);else car.v-=4*dt}
 car.v-=Math.sign(car.v)*(.5+Math.abs(car.v)*.02)*dt;car.v=Math.max(-8,Math.min(vm,car.v));if(Math.abs(car.v)<.15&&!KY.g&&!KY.b)car.v=0;
 car.lat+=car.st*dt*(2.4*(.5+.5*Math.min(1,Math.abs(car.v)/12)))-curv(car.s+10)*car.v*car.v*dt*.18;

 const ps=car.s;car.s=Math.max(0,car.s+car.v*dt);acc+=Math.abs(car.v)*dt;if(acc>50){acc-=50;pay(5)}
 const p=at(car.s,car.lat),yaw=car.st*.1;car.m.position.set(p.x,0,p.z);car.m.rotation.set(-car.st*car.v*.0015,-(p.t+yaw),0,'YXZ');
 // wheels: rolling + front steering
 {const ud=car.m.userData;if(ud.wheels){const spin=car.v*dt/ud.r;for(const w of ud.wheels){w.rotation.order='YXZ';w.rotation.x-=spin}const sa=-car.st*0.45;for(const w of ud.fw)w.rotation.y=sa}}
 for(const t of TRF){if(t.s<car.s-30||t.s>car.s+500){t.s=car.s+90+Math.random()*300;t.lat=LANES[Math.random()<.5?0:2];const spd=AI==5?(loopZone(car.s)==1?1.8:loopZone(car.s)>=3?.5:1):(AI==1?1.8:1);t.v=(7+Math.random()*8)*spd}t.s+=t.v*dt;const q=at(t.s,t.lat);t.m.position.set(q.x,0,q.z);t.m.rotation.y=-q.t;const ds=t.s-car.s;if(!t._hold&&ds>-4.5&&ds<4.8&&Math.abs(t.lat-car.lat)<2.1){t.s=car.s+400;msg('Crash!',2)}}
 for(const k of COIN){if(k.s<car.s-10){k.s=car.s+40+Math.random()*250;k.lat=LANES[Math.random()*3|0]}const q=at(k.s,k.lat);k.m.position.set(q.x,1,q.z);k.m.rotation.y+=dt*3;if(Math.abs(k.s-car.s)<2.5&&Math.abs(k.lat-car.lat)<2){pay(25);k.s=-99}}
 const[i,se]=env();updRoad();upTL(ps);game(dt);updCheckpoints(dt);updPeds(dt);updShops();place(Math.max(0,Math.floor(car.s/8)-4));placeH(Math.max(0,Math.floor(car.s/80)-3));placeL(Math.max(0,Math.floor(car.s/24)-2));ground.position.set(p.x,0,p.z);gt.offset.set(p.x/5,-p.z/5);
 if(VM==0){const cp=at(car.s-8.5,car.lat*.7),lk=at(car.s+14,car.lat*.5),sk=Math.abs(car.lat)>RW?Math.random()*.08:0;cam.position.lerp(new THREE.Vector3(cp.x,3.4+sk,cp.z),Math.min(1,dt*6));cam.lookAt(lk.x,1.2,lk.z);cam.fov=60+Math.abs(car.v)*.6}
